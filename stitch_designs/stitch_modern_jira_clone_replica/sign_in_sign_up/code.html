  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;family=Space+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=block" rel="stylesheet">
  <style>
    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block;
      width: 1em;
      height: 1em;
      line-height: 1 !important;
      box-sizing: content-box;
      overflow: hidden;
      white-space: nowrap;
      direction: ltr;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-light-surface-container-low text-light-on-surface font-body antialiased">

  <main class="min-h-[1024px] flex flex-col items-center justify-center p-gutter-xl gap-gutter-xl" data-stitch-vh="min-h-[1024px]===min-h-screen">

    <!-- Brand Mark -->
    <div class="flex items-center gap-gutter-sm">
      <div class="w-9 h-9 rounded-sm bg-light-primary-container flex items-center justify-center text-light-on-primary">
        <span class="material-symbols-outlined text-[22px]" style="font-variation-settings: &#39;FILL&#39; 1;" aria-hidden="true">deployed_code</span>
      </div>
      <span data-design-text-token="headline-md" class="font-headline text-headline-md text-light-on-surface tracking-tight">Atlassian Jira</span>
    </div>

    <!-- Centered Auth Card -->
    <section aria-label="Authentication" class="w-full max-w-md rounded-lg bg-light-surface-container-lowest border border-light-outline-variant shadow-md p-gutter-xl flex flex-col gap-gutter-lg">

      <!-- Mode Switcher Tabs -->
      <div class="grid grid-cols-2 gap-gutter-xs p-1 rounded-sm bg-light-surface-container-low border border-light-outline-variant" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-auth-mode="signin" class="auth-tab py-1.5 rounded-sm bg-light-surface-container-lowest text-light-primary font-label text-label-md shadow-sm">Sign in</button>
        <button type="button" role="tab" aria-selected="false" data-auth-mode="signup" class="auth-tab py-1.5 rounded-sm text-light-on-surface-variant font-label text-label-md">Create account</button>
      </div>

      <header class="flex flex-col gap-gutter-xs text-center">
        <h1 id="auth-heading" data-design-text-token="headline-sm" class="font-headline text-headline-sm text-light-on-surface">Log in to continue</h1>
        <p id="auth-subheading" data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant">Access Platform Core and IT Service Desk workspaces</p>
      </header>

      <!-- Auth Form -->
      <form id="auth-form" action="../sprint-board/ActiveSprintBoard.html" class="flex flex-col gap-gutter-md">
        <div id="signup-fields" class="hidden flex flex-col gap-gutter-md">
          <div class="flex flex-col gap-gutter-xs">
            <label for="auth-name" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Full name</label>
            <input id="auth-name" type="text" placeholder="Elena Rostova" class="rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </div>
          <div class="flex flex-col gap-gutter-xs">
            <label for="auth-workspace" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Site URL</label>
            <input id="auth-workspace" type="text" placeholder="platform-core.atlassian.net" class="rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-mono text-mono-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
          </div>
        </div>

        <div class="flex flex-col gap-gutter-xs">
          <label for="auth-email" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Work email</label>
          <input id="auth-email" type="email" required value="elena.rostova@acme.dev" class="rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
        </div>

        <div class="flex flex-col gap-gutter-xs">
          <div class="flex items-center justify-between">
            <label for="auth-password" data-design-text-token="label-md" class="font-label text-label-md text-light-on-surface">Password</label>
            <a id="forgot-link" href="#" class="font-label text-label-sm text-light-primary hover:underline">Forgot password?</a>
          </div>
          <div class="relative flex items-center">
            <input id="auth-password" type="password" required value="••••••••••••" class="w-full pr-10 rounded-sm bg-light-surface-container-lowest border border-light-outline-variant font-body text-body-md text-light-on-surface focus:border-light-primary focus:ring-1 focus:ring-light-primary">
            <button id="toggle-pw-btn" type="button" aria-label="Show password" class="absolute right-2 text-light-on-surface-variant hover:text-light-on-surface flex items-center justify-center">
              <span class="material-symbols-outlined text-[18px]" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <button id="auth-submit-btn" data-component-id="button-primary" data-component-type="button" data-component-variant="primary" type="submit" class="w-full inline-flex items-center justify-center py-2 rounded-sm bg-light-primary text-light-on-primary hover:bg-light-primary-container transition-colors duration-state-change mt-gutter-xs">
          <span id="auth-submit-label" data-design-text-token="label-lg" class="font-label text-label-lg">Sign in to Jira</span>
        </button>
      </form>

      <div class="flex items-center gap-gutter-md">
        <div class="flex-1 h-px bg-light-outline-variant"></div>
        <span data-design-text-token="label-sm" class="font-label text-label-sm text-light-on-surface-variant uppercase">Or continue with</span>
        <div class="flex-1 h-px bg-light-outline-variant"></div>
      </div>

      <!-- SSO Providers -->
      <div class="flex flex-col gap-gutter-sm">
        <a href="../sprint-board/ActiveSprintBoard.html" class="w-full py-2 px-gutter-md rounded-sm bg-light-surface-container-lowest border border-light-outline-variant hover:bg-light-surface-container-low flex items-center justify-center gap-gutter-sm font-label text-label-md text-light-on-surface transition-colors duration-state-change">
          <span class="material-symbols-outlined text-[18px] text-light-primary" aria-hidden="true">passkey</span>
          <span>Continue with SAML SSO (Okta)</span>
        </a>
        <div class="grid grid-cols-2 gap-gutter-sm">
          <a href="../sprint-board/ActiveSprintBoard.html" class="py-2 px-gutter-md rounded-sm bg-light-surface-container-lowest border border-light-outline-variant hover:bg-light-surface-container-low flex items-center justify-center gap-gutter-xs font-label text-label-md text-light-on-surface transition-colors duration-state-change">
            <span>Google</span>
          </a>
          <a href="../sprint-board/ActiveSprintBoard.html" class="py-2 px-gutter-md rounded-sm bg-light-surface-container-lowest border border-light-outline-variant hover:bg-light-surface-container-low flex items-center justify-center gap-gutter-xs font-label text-label-md text-light-on-surface transition-colors duration-state-change">
            <span>Microsoft</span>
          </a>
        </div>
      </div>

    </section>

    <p data-design-text-token="body-sm" class="font-body text-body-sm text-light-on-surface-variant text-center">
      Protected by Atlassian Guard · Enterprise SAML 2.0 &amp; SCIM enabled
    </p>

  </main>

  <script>
    (function () {
      const tabs = document.querySelectorAll('.auth-tab');
      const signupFields = document.getElementById('signup-fields');
      const heading = document.getElementById('auth-heading');
      const submitLabel = document.getElementById('auth-submit-label');
      const forgotLink = document.getElementById('forgot-link');

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          const mode = tab.dataset.authMode;
          tabs.forEach(t => {
            const active = t.dataset.authMode === mode;
            t.setAttribute('aria-selected', String(active));
            t.className = active
              ? 'auth-tab py-1.5 rounded-sm bg-light-surface-container-lowest text-light-primary font-label text-label-md shadow-sm'
              : 'auth-tab py-1.5 rounded-sm text-light-on-surface-variant font-label text-label-md';
          });
          const isSignup = mode === 'signup';
          signupFields.classList.toggle('hidden', !isSignup);
          forgotLink.classList.toggle('hidden', isSignup);
          heading.textContent = isSignup ? 'Create your Jira account' : 'Log in to continue';
          submitLabel.textContent = isSignup ? 'Create workspace account' : 'Sign in to Jira';
        });
      });

      const pwInput = document.getElementById('auth-password');
      const pwBtn = document.getElementById('toggle-pw-btn');
      pwBtn.addEventListener('click', () => {
        const show = pwInput.type === 'password';
        pwInput.type = show ? 'text' : 'password';
        pwBtn.querySelector('.material-symbols-outlined').textContent = show ? 'visibility_off' : 'visibility';
        pwBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    })();
  </script>
